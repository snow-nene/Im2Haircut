[workspace]
name = "im2haircut"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "11.8"

[dependencies]
python = "3.9.*"
pip = "*"
pytorch = "2.1.1.*"
torchvision = "0.16.1.*"
torchaudio = "2.1.1.*"
pytorch-cuda = "11.8.*"
cuda-version = "==11.8"
# Compiler tools for compiling submodules - limit to GCC 11 for CUDA 11.8 compatibility
gcc = "11.*"
gxx = "11.*"
gxx_linux-64 = "11.*"
cmake = "*"
# Conda packages
plyfile = "*"
pyhocon = "*"
icecream = "*"
einops = "*"
accelerate = "*"
jsonmerge = "*"
easydict = "*"
iopath = "*"
scikit-image = "*"
fvcore = "*"
toml = "*"
tqdm = "*"
gdown = "*"
colmap = "*"

[pypi-dependencies]
tensorboard = "*"
tensorboardx = ">=2.6"
trimesh = "*"
matplotlib = "*"
scipy = "*"
moderngl = "*"
timm = "==0.5.4"
opencv-python = "*"
pysdf = "==0.1.9"
clean-fid = "==0.1.35"
face-alignment = "==1.4.1"
clip = { url = "https://github.com/openai/CLIP/archive/master.zip" }
torchdiffeq = "==0.2.3"
torchsde = "==0.2.5"
resize-right = "==0.0.2"
# Submodules
pytorch3d = { path = "submodules/external/GaussianHaircut/ext/pytorch3d" }
simple-knn = { path = "submodules/external/GaussianHaircut/ext/simple-knn" }
diff-gaussian-rasterization = { path = "submodules/external/GaussianHaircut/ext/diff_gaussian_rasterization_hair" }

[pypi-options]
no-build-isolation = ["diff-gaussian-rasterization", "pytorch3d", "simple-knn"]
